name: Build bundle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# No push trigger: GitHub evaluates push workflows from the pushed branch, and this file exists only on main.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and push generated bundle
        run: node scripts/build-bundle.mjs --push
